<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="SIMPLYCLEAN CRM: Sparkling-clean operations for cleaning businesses.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070b"/><stop offset="1" stop-color="#11121c"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6" stop-opacity="0"/><stop offset=".5" stop-color="#14b8a6" stop-opacity=".9"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <radialGradient id="ga"><stop offset="0" stop-color="#14b8a6" stop-opacity=".42"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb"><stop offset="0" stop-color="#38bdf8" stop-opacity=".34"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect width="1280" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif}
    .mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace}
    .spin{animation:spin linear infinite}.rev{animation-direction:reverse}
    .orb{animation:drift 16s ease-in-out infinite alternate}.orb2{animation:drift2 20s ease-in-out infinite alternate}
    .scan{animation:scan 7s linear infinite}.blink{animation:blink 1.1s steps(1) infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes drift{to{transform:translate(140px,40px)}}
    @keyframes drift2{to{transform:translate(-160px,-30px)}}
    @keyframes scan{from{transform:translateX(-500px)}to{transform:translateX(1500px)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <circle class="orb" cx="260" cy="40" r="300" fill="url(#ga)"/>
    <circle class="orb2" cx="1050" cy="320" r="320" fill="url(#gb)"/>
    <g class="spin" style="transform-origin:1085px 196px;animation-duration:28s"><polygon points="1085.0,100.0 1168.1,148.0 1168.1,244.0 1085.0,292.0 1001.9,244.0 1001.9,148.0" fill="none" stroke="url(#acc)" stroke-width="2" stroke-opacity="0.9"/></g>
    <g class="spin rev" style="transform-origin:1085px 196px;animation-duration:38s"><polygon points="1109.0,130.2 1153.9,183.9 1129.9,249.7 1061.0,261.8 1016.1,208.1 1040.1,142.3" fill="none" stroke="url(#acc)" stroke-width="1.25" stroke-opacity="0.68"/></g>
    <g class="spin" style="transform-origin:1085px 196px;animation-duration:48s"><polygon points="1113.3,162.3 1128.3,203.7 1100.0,237.4 1056.7,229.7 1041.7,188.3 1070.0,154.6" fill="none" stroke="url(#acc)" stroke-width="1.25" stroke-opacity="0.46"/></g>
    <circle cx="1085" cy="196" r="5" fill="#14b8a6"/>
    <text x="64" y="70" class="mono" font-size="14" letter-spacing="3" fill="#14b8a6">◆ F0RGER123 / SimplyClean-CRM</text>
    <text x="1216" y="70" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#9a9aa8">PUBLIC · MIT</text>
    <text x="64" y="174.56" class="sans" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#ttl)">SIMPLYCLEAN CRM</text>
    <text x="64" y="216.56" class="mono" font-size="19" fill="#c9c9d6">Sparkling-clean operations for cleaning businesses.<tspan class="blink" fill="#14b8a6"> ▍</tspan></text>
    <g transform="translate(64,262)"><rect width="97" height="30" rx="15" fill="#14b8a6" fill-opacity=".08" stroke="#14b8a6" stroke-opacity=".45"/><text x="48.5" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">React 18</text></g>
    <g transform="translate(171,262)"><rect width="62" height="30" rx="15" fill="#14b8a6" fill-opacity=".08" stroke="#14b8a6" stroke-opacity=".45"/><text x="31" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">Vite</text></g>
    <g transform="translate(243,262)"><rect width="97" height="30" rx="15" fill="#14b8a6" fill-opacity=".08" stroke="#14b8a6" stroke-opacity=".45"/><text x="48.5" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">Tailwind</text></g>
    <g transform="translate(350,262)"><rect width="97" height="30" rx="15" fill="#14b8a6" fill-opacity=".08" stroke="#14b8a6" stroke-opacity=".45"/><text x="48.5" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">Recharts</text></g>
    <text x="1216" y="306" text-anchor="end" class="mono" font-size="12" letter-spacing="3" fill="#6e6e7c">SC-01</text>
    <rect class="scan" x="0" y="337" width="420" height="3" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="339" rx="20" fill="none" stroke="url(#acc)" stroke-opacity=".35"/>
</svg>
